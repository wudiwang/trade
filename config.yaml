# ============================================================
# 缠论分型交易系统 — 主配置
# 密钥不放这里，放 .env（TELEGRAM_BOT_TOKEN / BINANCE_API_KEY 等）
# Web 配置页修改的参数会写入 SQLite settings 表并热生效，
# settings 表里的值优先于本文件。
# ============================================================

# ⚠️ 本文件只是【默认值】。Web 控制台「参数配置」改过的项存在数据库 settings 表,
#    启动时会覆盖这里 —— 包括下面的 mode / trade_direction。
#    线上实际生效的值以启动日志里的「settings 覆盖」告警或控制台为准, 不要只看本文件。
#    (2026-10-26: 此处写 paper, 实际被 settings 覆盖为 live, 曾导致误判"模拟盘不会真下单"。)
mode: paper            # paper=模拟盘(验证模式是否赚钱) / live=真实下单
trade_direction: both  # both=多空都做 / long=只做多 / short=只做空(只对该方向信号开仓/推送)

# ---- 自动交易(live) ----
live:
  auto_trade: false      # true=信号直接下单(免Telegram二次确认); false=仍需TG手动二次确认
  fixed_margin_pct: 10   # 单笔保证金占账户本金%, 名义额=本金×该比例×杠杆
  fixed_margin_u: 0      # 单笔固定保证金(U), >0时优先于fixed_margin_pct
  fixed_notional_u: 0    # 单笔固定名义额(U), 0=用风险算法
  max_positions: 10      # 实盘最大同时持仓数(达到不再自动开新仓)
  max_loss_pct: 50       # 划转校正余额相对本金亏损达此%→熔断, 停止自动交易
strategy: chan_bi      # chan_bi=缠论笔+停顿K(当前) / spring_v4=破位+底分型 / chan_v1=旧
timeframes: ["5m", "15m", "1h"]   # 5m自身;15m结构用5m停顿触发;1h结构用15m停顿触发

# ---- 手动BTC大趋势 -> 山寨二买/二卖 ----
macro_pullback:
  enabled: true
  exclusive: true          # true=paper只跑这套BTC手动二买/二卖策略
  timeframes: ["5m", "15m"]
  directions: ["long", "short"]       # 默认多空双向监控
  structure_tf: 15m
  trigger_tf: 5m
  context_tf: 1h
  vol_ma: 20
  vol_mult: 3.0
  lookback: 20
  reclaim_bars: 4
  reclaim_tolerance_pct: 0.5
  reclaim_body_pct: 80       # spring/UTAD: 后续K收回爆量K实体80%区间即成立
  wyckoff_fractal_window: 5   # 爆量K允许出现在真正L1/H1分型前后N根内
  min_leg_pct: 0.8
  second_tolerance_pct: 0.2
  stop_buffer_pct: 0.0
  max_signal_bars_after_second: 2   # (旧)保留兼容; 停顿死线现由 stall_max_gap_bars 控
  stall_max_gap_bars: 2             # 2026-07-29 停顿改用合并K右K极值判定, 分型确认后N根内出现即算(放宽死线)
  max_entry_leg_ratio: 0.5          # 入场相对L2/H2脱离不超过前一段振幅50%, 中位线只参考不一票否决
  min_effective_bars_between: 7     # 各段至少7根去包含K(含两端)。2026-07-29 用户由5提到7(5太松, ACE案例门门压线)
  # ↓ 2026-07-19 由 15 条人工触发反馈反推(ok组5条 vs bad组10条在这三项上几乎完全分离)
  retrace_min: 0.20         # 回调下限(2026-07-29 用户: 回调幅度落在20%~50%区间)
  retrace_max: 0.50          # 回调深度上限(2026-07-29 用户重定规则: 爆量K低点→第一波反弹高点, 回调50%以内即合格)
  leg_body_ratio_min: 0      # 0=关闭(2026-07-29 用户新规格只用"回调≤50%"判定, 实体门槛曾误杀LINK 0.36 vs 0.38)
  max_leg_pct: 15.0          # 反弹幅度上限%: 高于=「反弹太高」, 属追高不是中继
  cooldown_bars: 12
  min_rr: 1.5
  tp_rr_long: 2.0          # 回测最佳: 二买做多用2R
  tp_rr_short: 2.0         # 多空统一先用2R止盈
  tp_lookback: 100
  vp_bins: 50

# ---- 缠论笔策略 ----
chan:
  bi_min_bars: 5         # 一笔至少N根合并K(去包含后)
  stall_max_gap: 3       # 底/顶分型后N根内出现停顿K才确认
  mtf_tol_pct: 0.6       # 多级别:次级停顿与高级别分型的价位容差%
  fractal_vol_ma: 10     # 量能规则:底分型前2根均量回看根数
  fractal_vol_mult: 2.0  # 量能规则:底分型前2根任意一根量≥N×均量(只认最强/标准分型)
  require_divergence: true  # 一买/一卖必须背驰(离开段b比进入段a弱 或 MACD柱缩减,任一)
  macd_fast: 12          # 背驰用 MACD 快线
  macd_slow: 26          # 背驰用 MACD 慢线
  macd_signal: 9         # 背驰用 MACD 信号线
  strong_reversal_15m: false  # 仅15m强反转(过严,7天40币只过3次,已关→15m回到与5m同样标准闸)
  reversal_body_ratio: 0.6    # 强反转:右K实体≥自身振幅×该比例
  trend_reversal_alert: false  # ④趋势反转提示 — 已回退关闭(用户待想清楚再开)
  hs_top_alert: false     # 头肩顶提示 — 已回退关闭(用户待想清楚再开)
  hs_shoulder_tol_pct: 8.0    # 头肩顶两肩高度容差%
  trend_filter: true     # ⑤顺势过滤: 上升趋势禁做空、下降趋势禁做多(震荡放行)
  trend_ma: 20           # 趋势判定均线周期
  trend_lookback: 10     # 均线斜率回看根数
  trend_slope_pct: 0.3   # 斜率阈值%(MA近lookback根涨跌超过此值=趋势, 内=震荡)

# ---- 威科夫弹簧买点(Spring/UTAD) 独立路径 ----
wyckoff:
  enabled: true
  confirm_only: false    # false=威科夫独立开仓(回测7/14天期望稳定+0.23); true=仅提示不开仓
  require_divergence: false  # (已去掉背驰收紧)
  dryup_only: false      # (已去掉"只缩量"收紧)
  vol_mult: 3.0          # 扫破前低那根下跌K量能 ≥ 前20根均量×3 才算(放量假突破)
  lookback: 20           # 前低/前高回看根数(确定支撑/阻力)
  reclaim_bars: 4        # 扫破后N根内收回才算弹簧
  pierce_tol_pct: 0.0    # 扫破容差%(0=只要破)
  vol_ma: 20             # 扫破K量能参照均线
  climax_mult: 2.0       # 放量弹簧门槛(扫破K量≥N×均量)
  dryup_ratio: 1.0       # 缩量弹簧门槛(扫破K量<N×均量=供给枯竭,最强)
  min_bounce_pct: 1.5    # 前低形成后须反弹离开≥N%(确保回探支撑,非下跌途中)
  wick_min: 0.0          # 扫破K反向影线门槛(0=关:放量下跌阴线常收低位无下影,与放量假突破冲突)
  cooldown_bars: 10      # 同币同级别同向N根内只出一次弹簧(防洪水)
  overlap_bars: 3        # 双信号重叠时间窗(根):缠论买点+威科夫买点同位共振

# ---- 策略V4: 放量破位 → 底分型收回破位K顶部 ----
spring:
  vol_mult: 4.0            # 破位K量 >= N×前20根均量
  newlow_lookback: 20      # 破位=创近N根新低(做空看新高)
  body_min: 0.5            # 破位K实体占比下限
  fractal_window: 8        # 破位后N根内须出底分型(收回破位K顶部)，否则作废
  buy2_window: 60          # 一买后N根内跟踪二买
  maink_range_atr: 1.2     # 主力K振幅 >= N×ATR(可选标注)
  tp_lookback: 100         # 止盈回看根数(找下跌前的顶/密集区)
  min_rr: 1.5              # 预期盈亏比低于此值不进场
  btc_filter: true         # BTC大盘方向过滤(下跌不做多/上涨不做空)

# ---- 币种筛选 ----
universe:
  quote: USDT                  # 只监控 U 本位永续
  min_quote_volume_24h: 0      # 0=全部合约币种；高于0则按24h成交额过滤
  refresh_minutes: 60          # 每小时刷新一次币种列表
  exclude: []                  # 手动排除的币种

# ---- 信号规则 ----
signal:
  fractal_lookback: 3          # 分型确认所需K线数(包含处理后)
  vol_ma_period: 20            # 量能均线周期
  vol_multiplier: 1.5          # 分型最低K量能 >= 1.5x 均量才有效
  vol_strong: 2.0              # >= 2.0x 标记为强信号
  break_reclaim_lookback: 30   # 跌破收回: 在最近30根K里找被跌破的前低
  sl_buffer_pct: 0.3           # 止损=前低下方0.3%
  tp_vp_lookback: 200          # 止盈: 用最近200根K做Volume Profile找上方密集成交区
  tp_vp_bins: 50               # Volume Profile 桶数
  min_rr_primary: 5.0          # 主信号盈亏比门槛(推送TG)
  min_rr_secondary: 2.5        # 次级信号门槛(只入库统计,用于对比验证)
  trend_filter: true           # 1h EMA50 趋势过滤(只做顺势)
  trend_ema_period: 50
  cooldown_bars: 10            # 同币种同级别触发后10根K内不重复提醒
  signal_ttl_bars: 3           # 信号3根K内未确认则过期

# ---- 因子打分（基础规则之上的加分项，明细入库便于统计各因子胜率贡献）----
factors:
  min_score: 1                 # 因子总分达到该值才出信号（0=只记录不拦截）
  rsi_period: 14
  refresh_funding_minutes: 5
  atr_period: 14
  sl_atr_min: 0.5              # 止损距离下限(xATR) 硬过滤
  sl_atr_max: 3.0              # 止损距离上限(xATR) 硬过滤
  rsi_divergence: { enabled: true }                          # +2 RSI背离
  rsi_extreme: { enabled: true, oversold: 30, overbought: 70 }  # +1 RSI极值
  wick_rejection: { enabled: true, min_ratio: 0.5 }          # +1 极值K影线拒绝
  taker_ratio: { enabled: true, min_ratio: 0.58 }            # +1 确认K主动盘占比
  funding: { enabled: true, extreme: 0.0005 }                # +1 资金费率极值(0.05%)
  mtf_resonance: { enabled: true }                           # +1 5m与15m共振
  btc_resonance: { enabled: true }                           # +1 BTC大盘共振

# ---- 逼空检测(P5a) ----
squeeze:
  refresh_minutes: 15      # 每N分钟扫一次衍生数据
  oi_surge_pct: 30.0       # 持仓量2-3h涨幅≥N% = 骤增
  funding_extreme: 0.0005  # 资金费率绝对值≥(0.05%)算极值
  low_pos: 0.35            # 价格处于近200根区间下35%以内 = 低位

# ---- 仓位与风控 ----
risk:
  account_equity: 1000         # 账户规模(USDT), paper模式的虚拟本金
  risk_pct: 0.5                # 单笔风险=账户的0.5%
  max_positions: 5             # 最大同时持仓数
  max_margin_pct: 50           # 总保证金占用上限%
  leverage: 5                  # 默认杠杆
  tiered_tp: false             # 分批止盈(1.5R平1/3, 3R平1/3, 余下移动止损)

# ---- Web ----
web:
  host: 0.0.0.0
  port: 8488
  public_url: "http://76.13.182.175:8488"
  username: admin
  # 首次启动若 users 表为空, 用这个初始密码创建账号(登录后请修改)
  initial_password: "trade@2026"
  session_hours: 4320

# ---- 数据 ----
data:
  db_path: data/trade.db
  backfill_bars: 500           # 启动时每币每级别回填500根K
  kline_keep_bars: 1500        # 每币每级别最多保留1500根(自动清理)

# ---- 订单流页 (/flow.html)：深度热力图记录器 + 状态卡/CVD/清算图缓存 ----
flow:
  enabled: true                     # false=接口只回空载荷, 不起记录器/刷新任务, 不发任何上游请求
  db_path: data/flow_depth.sqlite   # 深度快照独立 sqlite(不进 trade.db); 约 7MB/天, 稳态 ~20MB
  interval_s: 30                    # 盘口快照间隔(秒)。币安合约权重 = 20 × 60/interval 每分钟
  keep_days: 8                      # 5分钟均值档保留天数(7天窗口要 ≥8); 原始30s快照固定只留2天
  half_range_pct: 2.5               # 只记录各交易所中间价 ±该百分比以内的挂单
  sources: [binance, bybit, okx, binance_spot]   # 录哪些源; 页面「全部」只合并三个合约源, 现货需手动点选

# ---- 近实时提醒：只发 Telegram 文字通知，不下单、不产生交易信号 ----
# 三类：a) 手动价位提醒(Telegram「提醒 btc 63000」/ 网页添加)  b) 急跌  c) 跌破 N 日低点。
# 实时报价取自 5m K线流里未收盘K的推送(每币每秒最多一笔)；报价断了就退化成每根 5m 收盘补判一次。
# 下面的阈值来自 scripts/alert_calibrate.py --proxy dense 对约一年 BTCUSDT 1m 的回放(插值成每秒一笔，与实盘节奏一致；只数触发次数)：
#   急跌两档合计 ≈2.2 条/周(中位 1，P90 5，最多的一周 24，52 周里 23 周为 0)；跌破 2 日低点 ≈3.6 次/周；破位后续跌 ≈0.5 条/周。
#   (一分钟只喂四笔的粗口径会算出 ≈1.7 条/周，偏少；实盘的条数不会比 2.2 少。)
#   想更疏/更密：跑一遍校准脚本看表再改；settings 表热覆盖约 5 分钟内生效。
alerts:
  enabled: true            # 总开关。启动时为 false=不创建提醒引擎、不开实时报价通路(要重启才能打开)；运行中改成 false 约 5 分钟内停报
  symbols: ["BTCUSDT"]     # 报「急跌/破位」的币；手动价位提醒不受此限。阈值只按 BTC 校准过
  base_tf: 5m              # 取实时报价、重算参照低点、断线兜底所用的级别(须在 timeframes 里)
  levels:
    max_active: 50         # 同时生效的手动价位提醒上限
  drop:                    # b) 急跌：现价较滑动窗口内最高价回落 ≥ 阈值
    enabled: true
    directions: ["down"]   # 只报下跌；加 "up" 则同时报急涨
    windows_min: [5, 15]   # 滑动窗口(分钟)
    pct_5m: 1.5            # 5 分钟窗口阈值%
    pct_15m: 2.0           # 15 分钟窗口阈值%
    cooldown_min_5m: 30    # 5 分钟档响过后的冷却(分钟)
    cooldown_min_15m: 60   # 15 分钟档响过后的冷却(分钟)
    step_pct_5m: 0.75      # 冷却期内提前再响的步长%：窗口内跌幅比上次响时再深这么多，或(窗口跌幅仍≥阈值且)现价比上次提醒价再低这么多；0=冷却内不再响
    step_pct_15m: 1.0      # 同上，15 分钟档
  range_break:             # c) 破位：现价跌破最近 N 日最低价(参照价每根 5m 收盘重算)
    enabled: true
    directions: ["down"]   # 只报跌破低点；加 "up" 则同时报突破 N 日高点
    days: [2]              # N 日，可多档如 [2, 7]。7 日档约 1.8 次/周
    cooldown_min: 240      # 距上一次创新低不足这么久算同一次破位，不再响(720 → 约 2.4 次/周)
    buffer_pct: 0          # 要跌破参照价再多这么多%才算(0=刚破就算)
    step_pct: 3.0          # 同一次破位里(不停创新低、冷却一直顺延)，现价比上一条破位提醒的价格再低这么多%就再响一条「续跌」；0=关

# ---- 联动规则：A 币出现某事件 → 在 B 币上等入场形态。只提醒 + 模拟记账，没有任何实盘通道 ----
# 状态：未审核(CLAUDE.md 第七条：先出图审核，通过后才算期望)。逻辑说明见 docs/strategies/btcbreak_pump/logic.md。
# 入场只写进 signals 表(kind=alert, status=sim) + 一笔模拟单(track=规则名)，模拟单只认止盈/止损两种离场。
# 改这里的任何一项都要重启生效。
linked_rules:
  - name: btcbreak_pump        # 规则名 = 模拟单的 track 名 = 幂等键的一部分(上线后不要改名)
    enabled: true              # false=不创建这条规则
    paper: false               # true=入场时开模拟单并跟踪到止盈/止损；false=只发通知、只入库(用户 2026-11-17: 模拟统计意义不大, 只要提醒)
    audited: false             # 出图审核通过后才改成 true。false 期间日报与统计接口对这条规则只报笔数，不出胜率/盈亏/期望(第七条)
    trigger_symbol: BTCUSDT    # 触发币
    target_symbol: PUMPUSDT    # 入场币(不在监控范围内时只订阅行情，不评估其它策略信号)
    tf: 5m                     # 两个币都用这个级别的已收盘K
    lookback_hours: 48         # 触发①：收盘价 < 前 48h(不含本K)所有K的最低价
    vol_ma: 20                 # 触发②的均量回看根数(不含本K)
    vol_mult: 2.0              # 触发②：成交量 ≥ 该倍数 × 均量
    ttl_hours: 4               # 触发后待命多久；待命期内再次触发则从后一次重新起算
    require_stall: true        # true=底分型+停顿K(与已锁定的一买定义一致)；false=分型成立那根即入场
    stall_max_gap: 3           # 分型确认后几根内出现停顿K才算；没有就放弃该分型看下一个
    sl_buffer_pct: 0.3         # 止损 = 分型低点 × (1 − 该%)
    rr: 2.0                    # 止盈 = 入场 + rr × (入场 − 止损)
    require_low_intact: false  # true=停顿前分型低点已被跌破的分型直接剔除(默认不剔除，只在事件里标注)

# ---- Telegram ----
telegram:
  enabled: true
  poll_timeout: 25             # long polling 超时(秒)
  confirm_ttl_minutes: 30      # 确认按钮有效期

# ---- 币安 ----
binance:
  rest_base: https://fapi.binance.com
  ws_base: wss://fstream.binance.com
  testnet: false
  recv_window: 5000

# ---- 日报开关 ----
reports:
  paper_daily: false           # 每天 08:00 的「模拟信号统计日报」。重心已转到下面的实盘复盘, 默认不发; 改 true 恢复

# ---- 每日实盘复盘: 今天我有没有按规矩做? (Bybit 手动实盘, 对交易所严格只读) ----
# 开启步骤: ① 在 Bybit 新建一个【只读】API Key  ② 自己把 BYBIT_API_KEY / BYBIT_API_SECRET 两行写进服务器 .env
#           ③ 把下面 enabled 和 telegram_enabled 改成 true 并重启。密钥不是只读的会被拒绝使用。
# 用法: 每天 send_time 自动推送上一自然日的复盘; Telegram 发「复盘」「复盘 昨天」「复盘 2026-11-16」随时要;
#       登录控制台后看 /api/reviews (列表) 与 /api/reviews/2026-11-16 (某天完整页)。
review:
  enabled: false               # 总开关: false 时不联网、不生成, Telegram「复盘」指令只回一句怎么开启
  timezone: Asia/Shanghai      # 「一天」按哪个时区切, 报告里的钟点也用它 (可改 Asia/Bangkok)
  send_time: "00:10"           # 每天几点推送刚结束那一天的复盘 (timezone 下; 留 10 分钟等流水到齐; 要带引号)
  telegram_enabled: false      # 自动推送开关; false 时只在你发「复盘」时才发
  db_path: data/bybit_review.db
  output_dir: artifacts/bybit_reviews
  lookback_days: 7             # 往前多看几天成交: 隔夜拿到今天才离场的单子, 也能看到当初的进场和止损
  order_sync_minutes: 30       # 每隔多少分钟留存一次挂单快照(只读); 0=不留。交易所只留订单最新状态, 已取消的
                               #   止损单 24 小时后就查不到, 不留快照就没法判断「止损有没有被放宽」
  max_late_hours: 6            # 到点时程序没在跑: 之后这么多小时内启动仍会补发, 再晚就不发了
  ai_timeout_seconds: 120      # 可选的 AI 润色(默认关, 需环境变量 REVIEW_NARRATOR_AI=1)整份报告合计的时限; 结论永远由规则给出
  kline_timeout_seconds: 240   # 取 K 线合计最多花多久; 到点就按已取到的出报告(硬规矩只看订单, 不受影响)
  # -- 第一准则「只有止盈与止损」的判定口径 (硬规矩只看订单, 盈亏不参与) --
  principles:
    sl_grace_seconds: 120      # 进场后多少秒内挂好止损算「进场即设止损」; 超过算没设
    entry_window_seconds: 120  # 首笔成交后多少秒内的同向成交仍算同一次进场(分批吃单), 不算加仓
    sl_gap_seconds: 120        # 止损被撤掉后, 仓位裸奔超过多少秒算「止损被放宽」
    min_rr: 2.0                # 计划盈亏比参考线(仅参考, 不影响合规结论)
    horizon_hours: 72          # 手动平仓后往后看多久, 看价格先到原止盈还是原止损(中途下车的代价)
    flip_minutes: 30           # 平仓后多少分钟内在同一品种反向开仓, 记为当日「反手」
    reentry_minutes: 30        # 止损后多少分钟内同品种同方向重进, 记为「止损后立刻重进」
    max_trades_per_day: 0      # 每日开仓笔数上限; 0=不设上限, 只报数
    assume_single_stop_snapshot_unchanged: false  # 止损/止盈单挂出时的价位没有记录(只有成交或被撤时那一行)时:
                               #   false=记「未知」(证据不足); true=当作挂出后没改过
    target_min_rest_seconds: 300   # 进场时没有止盈位、中途才挂的止盈单: 挂出后不到这么多秒就成交, 算手动平仓
    stop_into_profit_is_exit: true # 止损被移到盈利一侧后触发 / 中途才加的追踪止损: true=算中途下车; false=算止损离场(只加注)
    breakeven_band_pct: 0.2        # 进场价盈利一侧这么多百分比以内的止损仍算保本止损(留出手续费)
  # -- 系统匹配(只描述这笔单在交易系统里的位置, 不改变合规结论) --
  match:
    min_trend_bars: 120        # 1h/4h 入场前连续K线少于这么多根, 趋势记「未知」
    fallback_to_1h_when_4h_range: true   # 4h 无序时改由 1h 定方向(报告的标签上会写明「按 1h」)
    range_when_price_left_last_centre: true  # 两个中枢给出方向、但价格已走到后枢反方向一侧: 记「无序」
    trigger_lookback_bars: 6   # 小级别触发(分型+停顿)必须出现在入场前几根K线内
    imbalance_lookback_bars: 12  # 入场前几根内找位移K(失衡)
    imbalance_body_mult: 3     # 位移K: 实体 ≥ 此前20根实体中位数的几倍
